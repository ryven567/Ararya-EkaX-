<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Form Contact</h1>
<form action="proses.php" method="post" enctype="multipart/form-data">
    <fieldset>
        <legend>Login</legend>
        <label for="nama">Nama:</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan Nama " required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Masukkan email " required>
        <br><br>
        <label for="subject">Subject:</label>
        <input type="subject" id="subject" name="subject" placeholder="Masukkan subject " required>
        <br><br>
        <label for="alamat">Pesan:</label><br>
        <textarea id="pesan" name="pesan" rows="5" cols="50" placeholder="Tulis pesan anda..." required></textarea><br><br>
        <button type="submit"><a href="home.html">Send</a></button>
        <button type="reset">Reset</button>
    </fieldset>
</body>
</html>
