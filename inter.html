<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Form URL</title>
</head>
<body>
	<h1>Form URL</h1>
	<form action="" method="get">
		<fieldset>
			<legend>URL</legend>
			<label for="url">URL:</label>
			<input type="url" id="url" name="url" placeholder="https://contoh.com" required>
			<br><br>

			<label for="tanggal">Tanggal:</label>
			<input type="date" id="tanggal" name="tanggal" required>
			<br><br>

			<label for="waktu">Waktu:</label>
			<input type="time" id="waktu" name="waktu" required>
			<br><br>

			<label for="jumlah">Jumlah:</label>
			<input type="number" id="jumlah" name="jumlah" min="1" placeholder="Masukkan jumlah" required>
			<br><br>

			<button type="submit"><a href="home.html">Send</a></button>
            <button type="reset">Reset</button>
		</fieldset>
	</form>
</body>
</html>
